[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "avif-native"] }
# avif-native: Steam serves description images as AVIF; decoded with system dav1d (an FFmpeg dependency already).
# Same HTTP/TLS stack as native/hydra-native (reqwest 0.13 + rustls with ring).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "http2", "charset", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Image decoding is painfully slow unoptimized; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 3
