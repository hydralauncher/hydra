[package]
name = "hydra-downloads"
description = "Downloads for the Rust rewrite: the HTTP downloader (byte ranges, resume, throttle), hosters, debrid and the download manager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = "0.7"
# rangeStatePath: sha256 of the file path, like Electron, so partial downloads carry over.
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
rustls.workspace = true
