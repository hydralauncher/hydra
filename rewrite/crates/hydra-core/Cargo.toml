[package]
name = "hydra-core"
description = "Hydra's main-process logic for the Rust rewrite: library, preferences, Hydra API, auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hydra-db = { path = "../hydra-db" }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
# Intl.Collator(undefined, { sensitivity: "base" }) for title sorting.
icu_collator = "2"
icu_locale_core = "2"
# new Date().toISOString()
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# the realtime WebSocket (services/sse/websocket-client.ts) over rustls with the OS roots
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls.workspace = true
rustls-platform-verifier = "0.7"
# profile image crops (events/profile, sharp in Electron)
image.workspace = true

[dev-dependencies]
