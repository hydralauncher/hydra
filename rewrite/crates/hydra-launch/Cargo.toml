[package]
name = "hydra-launch"
description = "Launching games and tracking them for the Rust rewrite: launch-game.ts, close-game.ts and the process watcher (playtime)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-db = { path = "../hydra-db" }
serde_json.workspace = true
# Same process listing as native/hydra-native (list_processes).
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# The umu-launcher updater: the GitHub release, its sha256 digest, the tarball.
reqwest.workspace = true
sha2 = "0.10"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
# examples/launch_probe installs the TLS provider like hydra_store::init_tls
rustls.workspace = true

[target.'cfg(unix)'.dependencies]
# setsid for detached launches, signals for close-game
libc = "0.2"
