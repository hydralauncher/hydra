[package]
name = "hydra-desktop"
description = "Hydra desktop app (Rust + Slint rewrite of the Electron app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hydra"
path = "src/main.rs"

[dependencies]
hydra-store = { path = "../hydra-store" }
hydra-media = { path = "../hydra-media" }
hydra-core = { path = "../hydra-core" }
hydra-downloads = { path = "../hydra-downloads" }
hydra-launch = { path = "../hydra-launch" }
hydra-db = { path = "../hydra-db" }
hydra-i18n = { path = "../hydra-i18n" }
# the in-game screenshot service: capture, focus and the hotkey (shared with native/hydra-native)
hydra-capture = { path = "../hydra-capture" }
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
reqwest.workspace = true
# i18next-browser-languagedetector stand-in: the OS language.
sys-locale = "0.3"
# Skia (Metal/DX12/Vulkan) measured best overall; winit-030 gives access to raw
# wheel events (line vs pixel deltas) for Chromium-like scrolling.
slint = { workspace = true, features = ["backend-winit", "renderer-skia", "renderer-software", "unstable-winit-030", "accessibility", "raw-window-handle-06"] }
# The auth site and other web flows in an OS webview (WebView2 / WebKitGTK).
wry = "0.57"
image.workspace = true
# ThumbHash placeholders sent with catalogue images (game.images[url].thumbHash).
thumbhash = "0.1"
base64 = "0.22"
# showOpenDialog (folder pickers), the system Downloads folder, free disk space.
rfd = "0.15"
dirs = "6"
# os.networkInterfaces() for the torrent network adapter setting
if-addrs = "0.13"
fs2 = "0.4"
interprocess = "2"

# OS notifications: Windows toasts (Electron sets the icon as appLogoOverride),
# libnotify-style D-Bus notifications elsewhere.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.55"
# the system tray (Windows; Linux needs a StatusNotifierItem host instead of GTK)
tray-icon = "0.26"

[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"


[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
