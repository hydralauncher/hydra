name: Locale Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  locale-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: yarn

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: locale-check-${{ runner.os }}-node22.21.0-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile --ignore-scripts

      - name: Materialize base revision
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            echo "No usable base revision, the check will report instead of comparing."
            exit 0
          fi

          target="$RUNNER_TEMP/locale-base"
          mkdir -p "$target"
          git archive "$BASE_SHA" src | tar -x -C "$target"

          echo "dir=$target" >> "$GITHUB_OUTPUT"
          echo "label=$(git rev-parse --short "$BASE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Check locales
        env:
          LOCALE_CHECK_BASE_DIR: ${{ steps.base.outputs.dir }}
          LOCALE_CHECK_BASE_LABEL: ${{ steps.base.outputs.label }}
        run: node scripts/check-locales.mjs
