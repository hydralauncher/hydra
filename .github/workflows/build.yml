name:  Mac Build

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "src/**"
      - "electron-builder.yml"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build.yml"

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "electron-builder.yml"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Mac Staging
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Show Mac environment
        run: |
          echo "=== macOS ==="
          sw_vers
          echo ""
          echo "=== Architecture ==="
          uname -m
          echo ""
          echo "=== CPU ==="
          sysctl -n machdep.cpu.brand_string
          echo ""
          echo "=== Node ==="
          node --version || true
          echo ""
          echo "=== Yarn ==="
          yarn --version || true

      - name: Install Rosetta 2
        run: |
          softwareupdate --install-rosetta --agree-to-license

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Verify Node architecture
        run: |
          echo "Node version:"
          node --version
          echo ""
          echo "Node architecture:"
          node -p "process.arch"
          echo ""
          echo "Node platform:"
          node -p "process.platform"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust architecture
        run: |
          rustc --version
          rustc -vV

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Verify Python architecture
        run: |
          python --version
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Python RPC with cx_Freeze
        run: python python_rpc/setup.py build

      - name: Build Mac
        run: yarn build:mac
        env:
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_STAGING_API_URL }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_STAGING_AUTH_URL }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_STAGING_CHECKOUT_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}

      - name: Create staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Staging
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  build-production:
    name: Mac Production

    if: github.event_name == 'push'

    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Show Mac environment
        run: |
          echo "=== macOS ==="
          sw_vers
          echo ""
          echo "=== Architecture ==="
          uname -m
          echo ""
          echo "=== CPU ==="
          sysctl -n machdep.cpu.brand_string

      - name: Install Rosetta 2
        run: |
          softwareupdate --install-rosetta --agree-to-license

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Verify Node architecture
        run: |
          echo "Node version:"
          node --version
          echo ""
          echo "Node architecture:"
          node -p "process.arch"
          echo ""
          echo "Node platform:"
          node -p "process.platform"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust architecture
        run: |
          rustc --version
          rustc -vV

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Verify Python architecture
        run: |
          python --version
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Python RPC with cx_Freeze
        run: python python_rpc/setup.py build

      - name: Build Mac
        run: yarn build:mac
        env:
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}

      - name: Create production artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Production
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
