name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - windows-installer-build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Hydra bakes these URLs into the bundle at build time. Upstream keeps them
      # in repository variables that a fork does not inherit, which produced an
      # installer with empty URLs: the UI rendered but the catalogue, sign-in
      # and downloads all failed. These are the documented public production
      # endpoints (docs.hydralauncher.gg/getting-started).
      MAIN_VITE_API_URL: https://hydra-api-us-east-1.losbroxas.org
      MAIN_VITE_AUTH_URL: https://auth.hydralauncher.gg
      MAIN_VITE_CHECKOUT_URL: https://checkout.hydralauncher.gg
      MAIN_VITE_EXTERNAL_RESOURCES_URL: https://assets.hydralauncher.gg
      RENDERER_VITE_EXTERNAL_RESOURCES_URL: https://assets.hydralauncher.gg

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # vcpkg needs a binary cache dir, otherwise it rebuilds libtorrent from
      # scratch on every run (and can run out of time).
      - name: Prepare native caches
        id: native-cache
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "hydra-vcpkg-archives"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          $image = "$env:ImageOS-$env:ImageVersion"
          "image=$image" >> $env:GITHUB_OUTPUT
          "prefix=v1-vcpkg-$env:RUNNER_OS-$image-$env:RUNNER_ARCH-x64-windows-static" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/hydra-native -> target
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.image }}
          cache-bin: false

      # A current committed bridge needs no vcpkg packages at all.
      - name: Check prebuilt torrent bridge
        id: torrent-bridge
        run: node scripts/torrent-bridge-prebuilt.cjs check

      - name: Restore vcpkg binary packages
        if: steps.torrent-bridge.outputs.current != 'true'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.native-cache.outputs.prefix }}-${{ hashFiles('native/torrent-bridge/**/vcpkg*.json', 'native/torrent-bridge/**/triplets/**') }}
          restore-keys: |
            ${{ steps.native-cache.outputs.prefix }}-

      - name: Install dependencies
        run: |
          $ErrorActionPreference = "Continue"
          yarn --frozen-lockfile 2>&1 | Tee-Object -FilePath yarn-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg binary packages
        if: steps.torrent-bridge.outputs.current != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # An empty endpoint still compiles and still launches; it just cannot
      # reach anything. Fail before spending half an hour building.
      - name: Verify endpoints are configured
        run: |
          $names = @(
            "MAIN_VITE_API_URL",
            "MAIN_VITE_AUTH_URL",
            "MAIN_VITE_CHECKOUT_URL",
            "MAIN_VITE_EXTERNAL_RESOURCES_URL",
            "RENDERER_VITE_EXTERNAL_RESOURCES_URL"
          )
          foreach ($name in $names) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "$name is empty: the installer would ship without working endpoints"
            }
            "$name = $value" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Build Windows installer
        run: |
          $ErrorActionPreference = "Continue"
          yarn build:win 2>&1 | Tee-Object -FilePath build-win.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Printed into the run summary so the reason is visible without opening logs.
      - name: Show failure details
        if: failure()
        run: |
          "## Build failed" >> $env:GITHUB_STEP_SUMMARY
          foreach ($log in @("yarn-install.log", "build-win.log")) {
            if (Test-Path $log) {
              "### $log (last 60 lines)" >> $env:GITHUB_STEP_SUMMARY
              "" >> $env:GITHUB_STEP_SUMMARY
              (Get-Content $log -Tail 60) | ForEach-Object { "    $_" } >> $env:GITHUB_STEP_SUMMARY
              "" >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            yarn-install.log
            build-win.log

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-windows-installer
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
            dist/*.zip
