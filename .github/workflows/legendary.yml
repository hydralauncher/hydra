name: Legendary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/legendary.yml"
      - "scripts/*legendary*"
      - "src/main/services/legendary*"
      - "src/shared/legendary*"
      - "resources/legendary/**"
      - "electron-builder.yml"
      - "build/entitlements.legendary.mac.plist"
      - "package.json"
      - "docs/legendary.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/legendary.yml"
      - "scripts/*legendary*"
      - "src/main/services/legendary*"
      - "src/shared/legendary*"
      - "resources/legendary/**"
      - "electron-builder.yml"
      - "build/entitlements.legendary.mac.plist"
      - "package.json"
      - "docs/legendary.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      # Match the native runners used by Legendary's pinned release build.
      matrix:
        include:
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      LEGENDARY_PLATFORM: ${{ matrix.platform }}
      LEGENDARY_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install native Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          architecture: ${{ matrix.arch }}

      # Preparation uses only Node.js built-ins. Do not install launcher or Python dependencies.
      - name: Download and verify pinned executable
        run: node scripts/prepare-legendary.cjs --platform "$LEGENDARY_PLATFORM" --arch "$LEGENDARY_ARCH"

      - name: Check native executable version
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { execFileSync } = require("node:child_process");
          const path = require("node:path");
          const manifest = require("./src/shared/legendary-manifest.json");
          const platform = process.env.LEGENDARY_PLATFORM;
          const arch = process.env.LEGENDARY_ARCH;

          assert.equal(process.platform, platform);
          assert.equal(process.arch, arch);
          const executable = path.resolve(
            "legendary", platform, arch, manifest.artifacts[platform][arch].fileName
          );
          const output = execFileSync(executable, ["--version"], {
            encoding: "utf8",
            shell: false,
            timeout: 60000,
            windowsHide: true,
          });
          assert.ok(output.includes(`legendary version "${manifest.version}"`), output);
          console.log(output.trim());
          NODE

      - name: Check macOS execution after hardened signing
        if: matrix.platform == 'darwin'
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { execFileSync } = require("node:child_process");
          const { copyFileSync, chmodSync } = require("node:fs");
          const path = require("node:path");
          const manifest = require("./src/shared/legendary-manifest.json");
          const source = path.resolve("legendary", "darwin", process.arch, "legendary");
          const executable = path.join(process.env.RUNNER_TEMP, "legendary-signed");
          copyFileSync(source, executable);
          chmodSync(executable, 0o755);
          execFileSync("codesign", [
            "--force", "--sign", "-", "--options", "runtime",
            "--entitlements", "build/entitlements.legendary.mac.plist", executable,
          ], { shell: false, timeout: 15000, stdio: "inherit" });
          const output = execFileSync(executable, ["--version"], {
            encoding: "utf8", shell: false, timeout: 60000,
          });
          assert.ok(output.includes(`legendary version "${manifest.version}"`), output);
          console.log(output.trim());
          NODE

  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0

      - name: Test preparation and packaging regressions
        run: node --test scripts/legendary.test.mjs

      - name: Confirm Linux preparation creates no binary cache
        run: |
          node scripts/prepare-legendary.cjs --platform linux --arch x64
          node -e 'require("node:assert/strict").equal(require("node:fs").existsSync("legendary"), false)'
