[package]
name = "hydra-save-insights"
description = "Reads game save files and extracts progress signals (level, playtime, quest, money, screenshot) for the cloud save conflict window. Pure Rust, no Node: hydra-native and Hydra Neo both depend on it."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27"
