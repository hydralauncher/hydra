[package]
name = "hydra-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
blake3 = "=1.8.5"
filetime = "0.2"
globetter = "=0.2.0"
globset = "=0.4.15"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
indexmap = { version = "2.14", features = ["serde"] }
mime_guess = "2.0.5"
napi = { version = "3.5.2", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3.3.2"
rayon = "=1.11.0"
reqwest = { version = "0.13", default-features = false, features = ["stream", "charset", "http2", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sysinfo = "0.37.2"
time = { version = "=0.3.47", features = ["parsing"] }
tokio = { version = "1.52", features = ["fs", "rt", "sync", "macros"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.11.0", features = ["v4"] }
walkdir = "=2.5.0"

[target.'cfg(windows)'.dependencies]
known-folders = "=1.2.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", default-features = false }

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
napi-build = "2.3.1"
